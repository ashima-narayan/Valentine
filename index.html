<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Be My Valentine 💖</title>

  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: linear-gradient(to right, #ff9a9e, #fad0c4);
      font-family: 'Arial', sans-serif;
      overflow: hidden;
    }

    .container {
      background: white;
      padding: 30px;
      border-radius: 25px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      max-width: 350px;
    }

    h1 {
      color: #ff4d6d;
      margin-bottom: 10px;
    }

    .gif {
      width: 250px;
      border-radius: 20px;
      margin: 15px 0;
    }

    .stickers {
      font-size: 24px;
      margin-bottom: 10px;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 20px;
    }

    button {
      padding: 12px 25px;
      font-size: 18px;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      transition: 0.3s;
    }

    #yesBtn {
      background-color: #ff4d6d;
      color: white;
    }

    #noBtn {
      background-color: #ccc;
      position: relative;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Will you be my Valentine? 💘</h1>

    <div class="stickers">🧸💕🌹💑</div>

    <img
      class="gif"
      src="https://media.giphy.com/media/26FLdmIp6wJr91JAI/giphy.gif"
      alt="Cute Teddy Couple"
    />

    <div class="buttons">
      <button id="yesBtn" onclick="yesClicked()">YES 💖</button>
      <button id="noBtn" onmouseover="moveNo()">NO 🙈</button>
    </div>
  </div>

  <script>
    function yesClicked() {
      alert("Yayyyy!!! 🥰💖 I knew it!!!\nYou just made my day ❤️");
    }

    function moveNo() {
      const noBtn = document.getElementById("noBtn");
      const x = Math.random() * 200 - 100;
      const y = Math.random() * 200 - 100;
      noBtn.style.transform = `translate(${x}px, ${y}px)`;
    }
  </script>
</body>
</html>
