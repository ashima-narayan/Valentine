<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Be My Valentine 💘</title>

  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: linear-gradient(to right, #ff9a9e, #fad0c4);
      font-family: Arial, sans-serif;
      margin: 0;
    }

    .container {
      background: white;
      padding: 30px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    h1 {
      color: #ff4d6d;
    }

    .buttons {
      margin-top: 20px;
    }

    button {
      padding: 12px 25px;
      font-size: 18px;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      margin: 10px;
    }

    #yesBtn {
      background-color: #ff4d6d;
      color: white;
    }

    #noBtn {
      background-color: #ccc;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Will you be my Valentine? 💖</h1>
    <p>💑🌹🥰</p>

    <div class="buttons">
      <button id="yesBtn" onclick="yesClicked()">YES 💘</button>
      <button id="noBtn" onclick="noClicked()">NO 🙈</button>
    </div>
  </div>

  <script>
    function yesClicked() {
      alert("Yayyy!!! 💕🥰 You just made my day!");
    }

    function noClicked() {
      alert("Oops 😜 Try again!");
    }
  </script>
</body>
</html>
